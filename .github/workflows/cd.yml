name: Build and Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish-npm:
    if: startsWith(github.event.release.tag_name, 'v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) requires Node >= 22.14.0 and npm >= 11.5.1.
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        # Pinned rather than `npm@latest`: Node 22.14.0 ships npm 10.x, which is
        # below the OIDC floor, and an unpinned upgrade makes the publish path
        # depend on whatever npm released today.
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run e2e

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        # `setup-node` with `registry-url` writes
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc. With
        # trusted publishing there is no token, so that expands to an empty
        # credential which npm tries instead of falling back to the OIDC exchange —
        # remove the stub so the exchange happens.
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm publish --access public
